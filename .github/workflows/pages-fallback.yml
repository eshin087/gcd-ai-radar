name: pages-fallback

# Fallback hosting if Vercel's free tier ever goes away: builds the static
# export and publishes ./out to GitHub Pages. Manual only. Enable Pages
# (Settings → Pages → Source: GitHub Actions) and, because the site uses
# root-relative paths, serve it from a custom domain or a user/org site
# root rather than the /<repo>/ sub-path.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public URL the site will be served from (used for canonical links, OG and RSS)"
        type: string
        default: "https://eshin087.github.io"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
