name: pages-fallback

# Fallback hosting if Vercel's free tier ever goes away: builds the static
# export and publishes ./out to GitHub Pages. Manual only. Enable Pages
# (Settings → Pages → Source: GitHub Actions) and, because the site uses
# root-relative paths, serve it from a custom domain or a user/org site
# root rather than the /<repo>/ sub-path.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public URL the site will be served from (used for canonical links, OG and RSS)"
        type: string
        default: "https://eshin087.github.io"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
