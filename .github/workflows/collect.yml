name: collect

on:
  schedule:
    # Every 6 hours, off the hour to avoid GitHub's top-of-the-hour queue delays.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the whole pipeline without writing or committing"
        type: boolean
        default: false
      source:
        description: "Only these source ids (comma-separated), ignoring schedules"
        type: string
        default: ""
      verbose:
        description: "Debug logging"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_GIT_NAME: ${{ vars.COLLECTOR_GIT_NAME }}
          COLLECTOR_GIT_EMAIL: ${{ vars.COLLECTOR_GIT_EMAIL }}
          COLLECTOR_DEBUG: ${{ inputs.verbose && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source=${{ inputs.source }}"; fi
          npm run collect -- $ARGS
