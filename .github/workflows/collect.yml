name: collect

on:
  schedule:
    # Hourly, off the hour to avoid GitHub's top-of-the-hour queue delays. Sources keep their own
    # cadence (every_run, six_hourly, daily, weekly, monthly in collector/config/sources.json);
    # a run that changes only bookkeeping files commits with "[no site change]" and skips the deploy.
    # Re-saved on 2026-10-26 so GitHub re-registers the hourly schedule: after the workflow was
    # disabled and re-enabled around the cron change, the 07:17 and 08:17 UTC slots did not fire.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the whole pipeline without writing or committing"
        type: boolean
        default: false
      source:
        description: "Only these source ids (comma-separated), ignoring schedules"
        type: string
        default: ""
      verbose:
        description: "Debug logging"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_GIT_NAME: ${{ vars.COLLECTOR_GIT_NAME }}
          COLLECTOR_GIT_EMAIL: ${{ vars.COLLECTOR_GIT_EMAIL }}
          COLLECTOR_DEBUG: ${{ inputs.verbose && '1' || '' }}
          # workflow inputs are passed as environment variables, never interpolated into the script
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$INPUT_SOURCE" ]; then ARGS="$ARGS --source=$INPUT_SOURCE"; fi
          npm run collect -- $ARGS
