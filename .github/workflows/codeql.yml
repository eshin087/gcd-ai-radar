name: codeql

# Static analysis of the TypeScript (site, collector, scripts) with GitHub's
# CodeQL: on every push to main, on pull requests, and weekly. Findings show
# under Security → Code scanning.

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "37 6 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
