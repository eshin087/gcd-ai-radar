name: audit

# Weekly dependency audit. Fails (and so emails the owner) on a high or
# critical advisory in a runtime dependency, or a critical one anywhere.
# Dependabot opens the fixing pull request; this job is the alarm.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Runtime dependencies, high or worse
        run: npm audit --omit=dev --audit-level=high
      - name: Every dependency, critical
        run: npm audit --audit-level=critical
