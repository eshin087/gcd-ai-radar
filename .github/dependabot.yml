version: 2
updates:
  # Keeps the pinned action SHAs current (the version comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  # npm: security updates always; routine bumps grouped into one PR a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types follow the runtime (engines: node 22.x); bump by hand with the Node upgrade.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # `typescript` is the TS 6 API alias that typescript-eslint and Next load; TS 7 itself is
      # `@typescript/native` (the tsc binary). Lift this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
