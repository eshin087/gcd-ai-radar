version: 2
updates:
  # Keeps the pinned action SHAs current (the version comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  # npm: security updates always; routine bumps grouped into one PR a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps of the toolchain arrive as separate, reviewable PRs only when
    # a security advisory needs them; routine majors are not proposed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
